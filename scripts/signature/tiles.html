<body><script>
(async () => {
  const N = 92, W = 1062, H = 450, GROW = 3, PAD = 2 + 3, GAP = 4
  const load = (k) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = `fa/f${String(k).padStart(4, '0')}.png` })
  const c = new OffscreenCanvas(W, H), g = c.getContext('2d', { willReadFrequently: true })
  const frames = []
  for (let k = 0; k < N; k++) { const img = await load(k); g.clearRect(0, 0, W, H); g.drawImage(img, 0, 0); frames.push(g.getImageData(0, 0, W, H)) }
  const tiles = []
  for (let k = 1; k < N; k++) {
    const a = frames[k - 1].data, b = frames[k].data
    let x0 = W, y0 = H, x1 = -1, y1 = -1
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = (y * W + x) * 4
      if (a[i] !== b[i] || a[i + 1] !== b[i + 1] || a[i + 2] !== b[i + 2] || a[i + 3] !== b[i + 3]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y } }
    if (x1 < 0) continue
    x0 = Math.max(0, x0 - PAD); y0 = Math.max(0, y0 - PAD); x1 = Math.min(W - 1, x1 + PAD); y1 = Math.min(H - 1, y1 + PAD)
    tiles.push({ k, x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 })
  }
  // shelf-pack the patches into one image, tallest first
  const AW = 2048
  const order = [...tiles].sort((p, q) => q.h - p.h)
  let sx = 0, sy = 0, shelf = 0
  for (const t of order) { if (sx + t.w > AW) { sx = 0; sy += shelf + GAP; shelf = 0 } t.ax = sx; t.ay = sy; sx += t.w + GAP; shelf = Math.max(shelf, t.h) }
  const AH = sy + shelf
  const atlas = new OffscreenCanvas(AW, AH), ag = atlas.getContext('2d')
  // each patch holds exactly what has to be laid over the frame before to make this one:
  // for every pixel, X over P = T, worked out in premultiplied colour. unchanged pixels come out clear.
  for (const t of tiles) { const tmp = new ImageData(t.w, t.h); const T = frames[t.k].data, P = frames[t.k - 1].data, X = tmp.data
    const same = (i) => T[i] === P[i] && T[i + 1] === P[i + 1] && T[i + 2] === P[i + 2] && T[i + 3] === P[i + 3]
    // which pixels changed, grown by a few pixels: each patch gets scaled to the screen on its own, and
    // where its edge meets old ink that was already solid, carrying on over it hides the seam. laying solid
    // ink over the same solid ink changes nothing, so this stays exact.
    const changed = new Uint8Array(t.w * t.h)
    for (let y = 0; y < t.h; y++) for (let x = 0; x < t.w; x++) if (!same(((t.y + y) * W + t.x + x) * 4)) changed[y * t.w + x] = 1
    const near = (x, y) => { for (let dy = -GROW; dy <= GROW; dy++) for (let dx = -GROW; dx <= GROW; dx++) { const xx = x + dx, yy = y + dy; if (xx >= 0 && yy >= 0 && xx < t.w && yy < t.h && changed[yy * t.w + xx]) return true } return false }
    for (let y = 0; y < t.h; y++) for (let x = 0; x < t.w; x++) {
      const i = ((t.y + y) * W + t.x + x) * 4, o = (y * t.w + x) * 4
      const at = T[i + 3] / 255, ap = P[i + 3] / 255
      if (!changed[y * t.w + x]) {
        if (T[i + 3] === 255 && near(x, y)) { X[o] = T[i]; X[o + 1] = T[i + 1]; X[o + 2] = T[i + 2]; X[o + 3] = 255 }
        continue
      }
      let ax
      if (ap >= 254 / 255) ax = 1
      else ax = Math.min(1, Math.max(0, (at - ap) / (1 - ap)))
      if (ax <= 0) ax = Math.min(1, at) // alpha fell (never expected): lay the new pixel down as it is
      for (let c = 0; c < 3; c++) {
        const tc = (T[i + c] / 255) * at, pc = (P[i + c] / 255) * ap
        const xc = Math.min(ax, Math.max(0, ax === 1 ? tc : tc - pc * (1 - ax)))
        X[o + c] = Math.round((xc / ax) * 255)
      }
      X[o + 3] = Math.round(ax * 255)
    }
    ag.putImageData(tmp, t.ax, t.ay) }
  const toB64 = async (blob) => { const buf = new Uint8Array(await blob.arrayBuffer()); let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode(...buf.subarray(i, i + 0x8000)); return btoa(s) }
  window.RESULT = { AW, AH, tiles, png: await toB64(await atlas.convertToBlob({ type: 'image/png' })), webp: await toB64(await atlas.convertToBlob({ type: 'image/webp', quality: 1 })) }
  document.title = 'done'
})()
</script></body>
